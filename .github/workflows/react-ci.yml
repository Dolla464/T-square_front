name: React CI/CD — aaPanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: react-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lint Check
        run: npm run lint || echo "::warning::Lint issues found (non-blocking)"

      - name: Run Tests
        run: npx vitest run || echo "::warning::Tests failed (non-blocking)"

      - name: Run NPM Audit
        run: npm audit --audit-level=high || echo "::warning::npm audit reported high-severity issues (non-blocking)"

  deploy:
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Deploy to aaPanel via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /www/wwwroot/tsquarecenter.com
            git fetch origin
            git reset --hard origin/main
            npm ci
            npm run build

      - name: Verify production site
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 https://tsquarecenter.com/ > /dev/null; then
              echo "Production verification succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Production verification attempt ${attempt} failed, retrying..."
            sleep 5
          done
          echo "Production verification failed after 3 attempts"
          exit 1

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Lighthouse Check
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://tsquarecenter.com
          temporaryPublicStorage: true
          uploadArtifacts: true